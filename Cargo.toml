[package]
name = "axum_api"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
lazy-regex = "3.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = "3.20.0"
strum_macros = "0.28.0"
tokio = { version = "1.52.3", features = ["full"] }
tower-cookies = "0.11.0"
tower-http = { version = "0.6.11", features = ["fs"] }
uuid = { version = "1.23.2", features = ["v4", "fast-rng"] }

[dev-dependencies]
anyhow = "1.0.102"
httpc-test = "0.1.10"
